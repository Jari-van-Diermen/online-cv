career-profile:
  title: Career Profile
  summary: |
    During my bioinformatics experience and internships, I worked with large volumes of biological
    data and computational methods. Through this, I discovered that my interest primarily
    lay in the technical work itself, such as designing and setting up data preprocessing pipelines,
    evaluating methodological choices, and writing and refining code.

    A key insight I gained from this was that my fascination stemmed more from crafting the software
    than from the biological findings that resulted from it. This realization has driven me
    to consciously focus on developing my technical skills and advancing in the field of
    software engineering.
education:
  title: Education
  info:
  - degree: MSc Molecular and Cellular life sciences (MCLS)
    university: Utrecht University
    time: 2020 - 2023
    details: |
      Specialization: Biophysics & Molecular Imaging, Bioinformatics minor profile

      During this master's program, I specialized in bioinformatics through fundamental research internships,
      where I deepened my Python and R data analysis skills and gained experience with machine learning,
      computational genomics, and bioinformatics techniques.
  - degree: BSc in Biology (Cum laude)
    university: Utrecht University
    time: 2017 - 2020
    details: |
      Graduated with honors (Cum laude).

      During this bachelor's program, I learned to model biological phenomena using mathematical models (ODEs), perform statistical analyses on biological data, and program in Python and R.
experiences:
  title: Experiences
  info:
  - role: Software Engineer
    time: 2026-03 - present
    company: Sogyo, De Bilt, The Netherlands
    details: |
      During this intensive traineeship, I have developed myself broadly in various programming styles and in
      approaching complex software problems in a structured manner. Subsequently, I contributed to the setup and
      application of an advanced AI-driven workflow. I have applied this methodology to the construction of the
      Sogyo Academy platform (.NET 10, React, RavenDB).

      - **Full AI-Workflow & Agent Harnessing**: Setting up a multi-step AI-workflow with specialized AI-agents for spec-driven software development.
      - **Human in the loop**: AI-workflow with built-in steps for human verification and approval.
      - **Full-Stack & Security**: Direct incorporation of user requirements into the development process, including security (authentication/authorization) via Keycloak.
      - **AI-workflow code quality**: Ensuring quality through an AI-integrated workflow with TDD, e2e-testing, Clean Architecture, and traceability.
      - **DevOps**: CI/CD-pipelines for streamlined deployments.

      *Crucial skills and experiences gained:*

      - **Architecture & Design**: Layered architecture, SOA, CQRS, TDD and Agile/Scrum.
      - **System design**: Design of robust application with UML and Clean Architecture.

      *Technologies, Frameworks & Tools:*

      - **Talen & Frameworks**: C#, Java, TypeScript, JavaScript, .NET Core, React, Next.js, Node.js
      - **Databases & DevOps**: RavenDB, MySQL, Git, CI/CD, Keycloak, Tailwind CSS

  - role: Phd candidate
    time: 2024/09 - 2026/03
    company: Hubrecht Institute, developmental epigenomics group (Jop Kind Group), Utrecht, The Netherlands
    details: |
      As a PhD candidate, I conducted research to better understand the fundamental
      principles of genome regulation during development. This taught me how to process,
      analyze and present large amounts of genomics data in HPC environments. Moreover, I developed pipelines
      for preprocessing multimodal genomics data ([sciT-snakemake pipeline](https://github.com/Jari-van-Diermen/SciT_snakemake))
      and an Accompanying R-package ([LoadSciLooms](https://github.com/Jari-van-Diermen/LoadSciLooms)),
      both of which aid the lab in its research efforts.
  - role: Research assistant
    time: 2023/07 - 2024/03
    company: Karolinska Institutet, Clinical Neurosciences (Robert Harris Group), Solna, Sweden
    details: |
      As a continuation of my work as a research intern, I improved the computational
      pipeline for evolutionary inference with improved parallelization, data cleaning, documentation
      and **Docker containerization** for reproducibility. Additionally, I developed a
      [data dashboard using **R shiny**](https://jari-van-diermen-shiny-app-acomys.share.connect.posit.cloud/)
      to improve exploration of the pipeline results. This allowed me to further improve my **Python**, **R**
      and **Bash** programming expertise 
  - role: Teaching assistant
    time: 2023/02 - 2023/05
    company: Utrecht university, Department of Biology, Utrecht, The Netherlands
    details: |
      As a teaching assistant for the course *Kwantitatieve biologie (B-B1KWBI20)*,
      I helped first-year biology students grasp statistical concepts and R programming.
  - role: Research intern
    time: 2022/05 - 2023/03
    company: Karolinska Institutet, Clinical Neurosciences (Robert Harris Group), Solna, Sweden
    details: |
      As a research intern, I have created a computational pipeline that uses evolutionary
      inference to better predict which genes are relevant for the regenerative
      wound-healing in the African Spiny mice. I gained extensive experience in
      **high performance computing (SLURM)**, programming (**R**, **Python** and **Bash**) and
      version control (**Git**, **Github**). Additionally, I learned to present and report my findings.

  - role: Research intern
    time: 2021/01 - 2022/03
    company: Utrecht university, Cell biology, neurobiology and biophysics, Anna Akhmanova Group (Cellular dynamics)
    details: |
      As a research intern, I studied proteins affecting cellular structure. This
      taught me extensive lab skills, in addition to planning and presenting
      experimental results.

